<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />

  <title>Payment Confirmed | ToteMove</title>
  <meta name="description" content="Your ToteMove order and payment were received. We'll be in touch to confirm your delivery date." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://totemove.ca/checkout-success" />

  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container nav-inner">
      <a href="/">
        <picture><source srcset="totemove-logo.webp" type="image/webp" /><img src="totemove-logo.png" alt="Tote Move" class="site-logo" width="160" height="44" /></picture>
      </a>
      <nav aria-label="Main navigation">
        <a href="/#faq" class="nav-link">FAQ</a>
        <a href="tel:+16476972505" class="nav-phone">(647) 697-2505</a>
        <a href="/" class="btn-nav">Back to home →</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <section class="checkout-success">
      <div class="container checkout-success-inner">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="checkout-success-icon">
          <circle cx="12" cy="12" r="11" fill="#3FC1EC" opacity=".15"/>
          <path d="M7 12l4 4 6-7" stroke="#3FC1EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="11" stroke="#3FC1EC" stroke-width="2"/>
        </svg>
        <h1>Payment received!</h1>
        <p class="checkout-success-body">Thanks<span id="successName"></span> — your order is confirmed and paid. We'll text or email you within a few hours to lock in your delivery window.</p>
        <div class="checkout-success-summary" id="successSummary" hidden>
          <div><span>Package</span><span id="successPackage"></span></div>
          <div><span>Move date</span><span id="successDate"></span></div>
          <div><span>Total paid</span><span id="successTotal"></span></div>
        </div>
        <a href="/" class="btn-amber">Back to home →</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <span>© 2026 TOTE MOVE · BRAMPTON, ON</span>
      <span>totemove.ca</span>
    </div>
  </footer>

  <script>
    try {
      const raw = sessionStorage.getItem('totemove-order-summary');
      if (raw) {
        const order = JSON.parse(raw);
        if (order.name) document.getElementById('successName').textContent = `, ${order.name.split(' ')[0]}`;
        if (order.packageName || order.total || order.moveDate) {
          document.getElementById('successPackage').textContent = order.packageName || '—';
          document.getElementById('successDate').textContent = order.moveDate || '—';
          document.getElementById('successTotal').textContent = order.total || '—';
          document.getElementById('successSummary').hidden = false;
        }
        sessionStorage.removeItem('totemove-order-summary');
      }
    } catch (e) { /* no-op — summary is a nice-to-have, not required */ }
  </script>
</body>
</html>
